[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gear_sonic"
version = "0.1.0"
description = "Unitree H2 deployment and VR teleoperation utilities"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
dependencies = ["numpy==1.26.4", "scipy==1.15.3"]

[project.optional-dependencies]
sim = [
    "mujoco==3.10.0", "tyro==1.0.15", "pyyaml==6.0.3",
    "pyzmq==27.1.0", "msgpack==1.2.1", "msgpack-numpy==0.4.8",
    "opencv-python==4.11.0.86", "loguru==0.7.3", "termcolor==3.1.0",
]
teleop = [
    "torch==2.8.0", "pin==2.7.0", "pyzmq==27.1.0",
    "msgpack==1.2.1", "loguru==0.7.3",
    "pyvista==0.48.4; platform_machine != 'aarch64'",
]
joystick = ["pygame==2.6.1"]

[tool.setuptools.packages.find]
where = [".."]
include = ["gear_sonic*"]
exclude = ["gear_sonic.tests*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gear_sonic = ["py.typed", "**/*.json", "**/*.yaml", "**/*.urdf", "**/*.xml", "**/*.stl", "**/*.STL", "**/*.pkl", "**/LICENSE*"]
