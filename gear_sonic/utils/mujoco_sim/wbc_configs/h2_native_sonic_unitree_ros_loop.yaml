ROBOT_TYPE: 'h2_native'
ROBOT_SCENE: "gear_sonic/data/assets/robot_description/unitree_ros/h2_description/H2_loop.xml"
MJCF_MESHDIR: "gear_sonic/data/assets/robot_description/unitree_ros/h2_description"
# H2_loop.xml already contains its own floor, light, and visual scene.
ADD_DEFAULT_MUJOCO_SCENE: False
ADD_H2_OFFICIAL_FOOT_CONTACT_GEOMS: False
CALIBRATE_BASE_Z_TO_H2_SOLE_CONTACT: True
H2_SOLE_CONTACT_CLEARANCE: 0.002

DOMAIN_ID: 0
INTERFACE: "lo"
SIMULATOR: "mujoco"

USE_JOYSTICK: 0
JOYSTICK_TYPE: "xbox"
JOYSTICK_DEVICE: 0

# H2 MJCF has a floating_base_joint.  FREE_BASE controls whether root torques
# are prepended to actuator ctrl; MuJoCo actuators only cover the 31 motors.
FREE_BASE: False
# Preserve the motor-side actuator limits and passive linkage parameters from
# Unitree's closed-loop MJCF. Output-coordinate PD torques are mapped to these
# actuators at runtime through the equality-constraint Jacobian.
OVERRIDE_MUJOCO_JOINT_FORCE_LIMITS: False
OVERRIDE_MUJOCO_DOF_PASSIVE: False
MUJOCO_INTEGRATOR: implicitfast
MUJOCO_SOLVER: Newton
MUJOCO_ITERATIONS: 50
MUJOCO_LS_ITERATIONS: 10
# Keep the official H2 asset unchanged while giving fast reference motions more
# tangential grip than MuJoCo's default floor friction [1.0, 0.005, 0.0001].
MUJOCO_FLOOR_FRICTION: [1.2, 0.005, 0.0001]

PRINT_SCENE_INFORMATION: True
ENABLE_ELASTIC_BAND: True
APPLY_DEFAULT_POSE_ON_RESET: True
# Preserve the Unitree ROS URDF's ankle-pitch mesh collisions.  The sole-contact
# calibration shifts this initial pose so the lowest mesh vertex starts 2 mm
# above the floor.
DEFAULT_BASE_POS: [0.0, 0.0, 1.11]
DEFAULT_BASE_QUAT: [1.0, 0.0, 0.0, 0.0]
# Match the G1 sim2sim elastic-band mechanism while accounting for H2's taller
# torso.  G1's anchor is about 0.207m above its attached pelvis at reset; H2's
# torso_link starts at about 1.09m, so 1.30m gives the same startup offset.
ELASTIC_BAND_POINT: [0.0, 0.0, 1.30]
ELASTIC_BAND_LENGTH: 0.0
# Use the same elastic-band stiffness/damping defaults as the G1 sim2sim path.
ELASTIC_BAND_KP_POS: 10000.0
ELASTIC_BAND_KD_POS: 1000.0
ELASTIC_BAND_KP_ANG: 1000.0
ELASTIC_BAND_KD_ANG: 10.0

# H2's raw MJCF + external Python PD loop is sensitive to integration step.
# Keep the deploy policy at 50 Hz, but compute/apply MuJoCo torques at 1000 Hz.
SIMULATE_DT: 0.001
VIEWER_DT: 0.02
# Fixed model: synchronize integration state instead of copying the full model/data.
# GUI input is retained; code-driven model edits require a full viewer.sync().
VIEWER_STATE_ONLY: True
REWARD_DT: 0.02
USE_SENSOR: False
USE_LOCAL_BASE_GYRO: True
USE_HISTORY: True
USE_HISTORY_LOCO: True
USE_HISTORY_MIMIC: True

# MuJoCo applies Unitree LowCmd as an explicit torque PD loop, matching
# unitree_mujoco:
#   tau + kp * (q_des - q) + kd * (dq_des - dq)

# Policy and DDS state remain in H2 PR/output coordinates. The actuator list
# replaces the passive knee/ankle-pitch/waist-roll/waist-pitch outputs with the
# motor-side coordinates provided by Unitree's H2_loop.xml, at the same logical
# positions in the 31-element local array.
MUJOCO_BODY_JOINT_NAMES: [
  left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint,
  left_knee_joint, left_ankle_roll_joint, left_ankle_pitch_joint,
  right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint,
  right_knee_joint, right_ankle_roll_joint, right_ankle_pitch_joint,
  waist_yaw_joint, waist_roll_joint, waist_pitch_joint,
  head_pitch_joint, head_yaw_joint,
  left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint,
  left_elbow_joint, left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint,
  right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint,
  right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint
]

MUJOCO_BODY_JOINT_LOGICAL_NAMES: [
  left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint,
  left_knee_joint, left_ankle_roll_joint, left_ankle_pitch_joint,
  right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint,
  right_knee_joint, right_ankle_roll_joint, right_ankle_pitch_joint,
  waist_yaw_joint, waist_roll_joint, waist_pitch_joint,
  head_pitch_joint, head_yaw_joint,
  left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint,
  left_elbow_joint, left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint,
  right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint,
  right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint
]

MUJOCO_BODY_ACTUATOR_JOINT_NAMES: [
  left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint,
  left_knee_motor_joint, left_ankle_roll_joint, left_ankle_A_joint,
  right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint,
  right_knee_motor_joint, right_ankle_roll_joint, right_ankle_A_joint,
  waist_yaw_joint, torso_constraint_R_joint, torso_constraint_L_joint,
  head_pitch_joint, head_yaw_joint,
  left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint,
  left_elbow_joint, left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint,
  right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint,
  right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint
]

MUJOCO_CLOSED_LOOP_TRANSMISSIONS:
  - name: left_ankle_loop
    output_joints: [left_ankle_roll_joint, left_ankle_pitch_joint]
    motor_joints: [left_ankle_roll_joint, left_ankle_A_joint]
    auxiliary_joints: [left_ankle_loop_rod_joint]
    equalities: [left_ankle_connect]
  - name: right_ankle_loop
    output_joints: [right_ankle_roll_joint, right_ankle_pitch_joint]
    motor_joints: [right_ankle_roll_joint, right_ankle_A_joint]
    auxiliary_joints: [right_ankle_loop_rod_joint]
    equalities: [right_ankle_connect]
  - name: left_knee_loop
    output_joints: [left_knee_joint]
    motor_joints: [left_knee_motor_joint]
    auxiliary_joints: [left_knee_loop_rod_joint]
    equalities: [left_knee_connect]
  - name: right_knee_loop
    output_joints: [right_knee_joint]
    motor_joints: [right_knee_motor_joint]
    auxiliary_joints: [right_knee_loop_rod_joint]
    equalities: [right_knee_connect]
  - name: waist_roll_pitch_loop
    output_joints: [waist_roll_joint, waist_pitch_joint]
    motor_joints: [torso_constraint_R_joint, torso_constraint_L_joint]
    auxiliary_joints: [right_waist_loop_rod_joint, left_waist_loop_rod_joint]
    equalities: [right_waist_connect, left_waist_connect]

